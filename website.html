<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词听写机官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "思源黑体 Light", "Source Han Sans CN Light", sans-serif;
            background-color: #19191c;
            color: #efefef;
            width: 100vw;
            height: 100vh;
        }

        #app {
            background-color: #27272a;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        #title {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 7%;
            width: 100%;
            background-color: #19191c;
            padding: 1rem 3%;
            gap: 5rem;
        }

        .info {
            font-size: 1rem;
            cursor: pointer;
        }

        #download-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1rem;
        }

        #download-main {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 25%;
            gap: 5rem;
            background-color: #27272a;
        }

        #download-1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .downloadButton {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            background-color: #efefef;
            padding: 0.6rem 1.1rem;
            border: none;
            font-size: 1.15rem;
            cursor: pointer;
        }

        .downloadButton:hover {
            background-color: #cfcfcf;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="title">
            <div class="info">产品</div>
            <div class="info">使用</div>
            <div class="info">下载</div>
        </div>
        <div id="download-main">
            <img src="example.png" alt="logo">
            <div id="download-info">
                <span style="font-size: 25px">强大的单词听写器</span>
                <div id="download-1">
                    <button class="downloadButton" onclick="document.getElementById('downloadLink').click()">下载 MacOS 版</button>
                    <a id="downloadLink" href="/Codes/SpellMaster.dmg" download="SpellMaster.dmg" style="display: none"></a >
                    <button class="downloadButton" onclick="document.getElementById('downloadLink2').click()">下载 Windows 版</button>
                    <a id="downloadLink2" href="/Codes/SpellMaster.exe" download="SpellMaster.exe" style="display: none"></a >
                </div>
            </div>
        </div>
        <div id="info-main"></div>
    </div>
</body>
</html>
